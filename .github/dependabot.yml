version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Amsterdam
    allow:
      - dependency-name: "nl.hauntedmc.platform:haunted-library-parent"
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Amsterdam
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 5
