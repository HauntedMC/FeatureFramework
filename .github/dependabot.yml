version: 2
# Maven versions come from HauntedPlatform and the reviewed internal release reconciler.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Amsterdam
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 5
