name: Consumer Compatibility

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - main

permissions:
  contents: read
  packages: read

jobs:
  migrated-consumers:
    name: ServerFeatures and ProxyFeatures
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PACKAGES_USER: ${{ secrets.HAUNTEDMC_PACKAGES_USERNAME }}
      PACKAGES_TOKEN: ${{ secrets.HAUNTEDMC_PACKAGES_TOKEN }}

    steps:
      - name: Validate repository and package token
        shell: bash
        run: |
          test -n "$PACKAGES_USER" \
            || { echo "Missing secret HAUNTEDMC_PACKAGES_USERNAME." >&2; exit 1; }
          test -n "$PACKAGES_TOKEN" \
            || { echo "Missing secret HAUNTEDMC_PACKAGES_TOKEN." >&2; exit 1; }

      - name: Resolve consumer refs
        id: consumer-refs
        shell: bash
        run: |
          set -euo pipefail

          resolve_ref() {
            local repository="$1"
            if curl --fail --silent --show-error \
              -H "Authorization: Bearer $PACKAGES_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/HauntedMC/${repository}/pulls?state=open&head=HauntedMC:featureframework&per_page=1" \
              | grep -q '"number":'; then
              printf '%s' 'featureframework'
            else
              printf '%s' 'main'
            fi
          }

          echo "serverfeatures=$(resolve_ref ServerFeatures)" >> "$GITHUB_OUTPUT"
          echo "proxyfeatures=$(resolve_ref ProxyFeatures)" >> "$GITHUB_OUTPUT"

      - name: Checkout FeatureFramework
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: featureframework
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          server-id: github
          server-username: PACKAGES_USER
          server-password: PACKAGES_TOKEN

      - name: Resolve candidate version
        id: candidate
        working-directory: featureframework
        shell: bash
        run: |
          set -euo pipefail
          version="$(./mvnw -q -DforceStdout help:evaluate -Dexpression=revision | tail -n 1)"
          test -n "$version" || { echo "Could not resolve FeatureFramework revision." >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install FeatureFramework candidate
        working-directory: featureframework
        shell: bash
        run: ./mvnw -U -B -ntp -DskipTests install

      - name: Checkout ServerFeatures consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: HauntedMC/ServerFeatures
          ref: ${{ steps.consumer-refs.outputs.serverfeatures }}
          token: ${{ secrets.HAUNTEDMC_PACKAGES_TOKEN }}
          path: serverfeatures
          persist-credentials: false

      - name: Verify ServerFeatures against candidate
        working-directory: serverfeatures
        shell: bash
        run: ./mvnw -U -B -ntp -Dfeatureframework.version="${{ steps.candidate.outputs.version }}" clean verify

      - name: Run ServerFeatures Paper acceptance against candidate
        working-directory: serverfeatures
        shell: bash
        run: ./mvnw -U -B -ntp -Pplatform-acceptance -Dfeatureframework.version="${{ steps.candidate.outputs.version }}" clean verify

      - name: Checkout ProxyFeatures consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: HauntedMC/ProxyFeatures
          ref: ${{ steps.consumer-refs.outputs.proxyfeatures }}
          token: ${{ secrets.HAUNTEDMC_PACKAGES_TOKEN }}
          path: proxyfeatures
          persist-credentials: false

      - name: Verify ProxyFeatures against candidate
        working-directory: proxyfeatures
        shell: bash
        run: ./mvnw -U -B -ntp -Dfeatureframework.version="${{ steps.candidate.outputs.version }}" clean verify

      - name: Run ProxyFeatures Velocity acceptance against candidate
        working-directory: proxyfeatures
        shell: bash
        run: ./mvnw -U -B -ntp -Pplatform-acceptance -Dfeatureframework.version="${{ steps.candidate.outputs.version }}" clean verify
