name: CI Tests and Coverage

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - main

permissions:
  contents: read
  packages: read

jobs:
  tests:
    name: Tests and Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    env:
      PACKAGES_USER: ${{ secrets.HAUNTEDMC_PACKAGES_USERNAME || github.actor }}
      PACKAGES_TOKEN: ${{ secrets.HAUNTEDMC_PACKAGES_TOKEN || github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate package token
        shell: bash
        run: |
          test -n "$PACKAGES_USER" \
            || { echo "Missing secret HAUNTEDMC_PACKAGES_USERNAME." >&2; exit 1; }
          test -n "$PACKAGES_TOKEN" \
            || { echo "Missing secret HAUNTEDMC_PACKAGES_TOKEN (requires read:packages)." >&2; exit 1; }

      - name: Verify dependency version ownership
        run: python3 scripts/verify-version-ownership.py

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          server-id: github
          server-username: PACKAGES_USER
          server-password: PACKAGES_TOKEN

      - name: Run Maven Verify
        id: tests
        run: ./mvnw -U -B -ntp verify

      - name: Verify external BOM consumption
        run: bash scripts/verify-bom-consumer.sh

      - name: Print failing test reports
        if: failure() && steps.tests.outcome == 'failure'
        shell: bash
        run: |
          # shellcheck disable=SC2016
          find . -type f \( -path '*/target/surefire-reports/*.txt' -o -path '*/target/failsafe-reports/*.txt' \) -print0 \
            | sort -z \
            | xargs -0 -r -n1 sh -c 'echo "::group::$0"; cat "$0"; echo "::endgroup::"'

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jacoco-report
          if-no-files-found: warn
          path: "**/target/site/jacoco"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports
          if-no-files-found: warn
          path: |
            **/target/surefire-reports
            **/target/failsafe-reports

  platform-acceptance:
    name: Paper and Velocity Platform Acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    env:
      PACKAGES_USER: ${{ secrets.HAUNTEDMC_PACKAGES_USERNAME || github.actor }}
      PACKAGES_TOKEN: ${{ secrets.HAUNTEDMC_PACKAGES_TOKEN || github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate package token
        shell: bash
        run: |
          test -n "$PACKAGES_USER" \
            || { echo "Missing secret HAUNTEDMC_PACKAGES_USERNAME." >&2; exit 1; }
          test -n "$PACKAGES_TOKEN" \
            || { echo "Missing secret HAUNTEDMC_PACKAGES_TOKEN (requires read:packages)." >&2; exit 1; }

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          server-id: github
          server-username: PACKAGES_USER
          server-password: PACKAGES_TOKEN

      - name: Run Paper and Velocity acceptance
        env:
          PLATFORM_ACCEPTANCE_WORK_DIRECTORY: ${{ runner.temp }}/featureframework-platform-acceptance
        run: ./mvnw -U -B -ntp -Pplatform-acceptance verify

      - name: Upload platform acceptance logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: featureframework-platform-acceptance-logs
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/featureframework-platform-acceptance/paper/paper.log
            ${{ runner.temp }}/featureframework-platform-acceptance/velocity/velocity.log

  maven-policy:
    name: Shared Maven policy
    uses: HauntedMC/HauntedPlatform/.github/workflows/maven-ci.yml@10dfbacc8515208bf3b0ee236a8c7688fda49c9e # release hardening
    with:
      maven-command: ./mvnw -U -B -ntp validate
    secrets:
      PACKAGES_USER: ${{ secrets.HAUNTEDMC_PACKAGES_USERNAME || github.actor }}
      PACKAGES_TOKEN: ${{ secrets.HAUNTEDMC_PACKAGES_TOKEN || github.token }}

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - shell: bash
        run: |
          mapfile -d '' scripts < <(git ls-files -z '*.sh')
          if (( ${#scripts[@]} == 0 )); then
            exit 0
          fi
          shellcheck tools/release/update-version tools/release/prepare-version.sh "${scripts[@]}"
  ci-required:
    name: ci-required
    if: ${{ always() }}
    needs: [tests, platform-acceptance, maven-policy, shellcheck]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      CHECK_RESULTS: ${{ toJSON(needs) }}
    steps:
      - name: Require every validation job
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          results = {name: job['result'] for name, job in json.loads(os.environ['CHECK_RESULTS']).items()}
          failed = {name: result for name, result in results.items() if result != 'success'}
          if failed:
              raise SystemExit(f'Validation did not pass: {failed}')
          PYTHON
