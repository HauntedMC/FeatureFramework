name: CI Lint

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  maven-policy:
    name: Shared Maven policy
    uses: HauntedMC/HauntedPlatform/.github/workflows/maven-ci.yml@v1.0.0
    with:
      maven-command: ./mvnw -U -B -ntp -DskipTests verify
    secrets:
      PACKAGES_USER: ${{ secrets.HAUNTEDMC_PACKAGES_USERNAME }}
      PACKAGES_TOKEN: ${{ secrets.HAUNTEDMC_PACKAGES_TOKEN }}

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - shell: bash
        run: |
          mapfile -d '' scripts < <(git ls-files -z '*.sh')
          if (( ${#scripts[@]} == 0 )); then
            exit 0
          fi
          shellcheck "${scripts[@]}"
